name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.set_image_url.outputs.image_url }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set image url
      id: set_image_url
      run: | 
        URL="ghcr.io/${{ github.repository }}:v1.0.${{(github.run_number)}}-${{github.sha}}"
        echo "IMAGE_URL=$URL" >> $GITHUB_ENV
        echo "image_url=$URL" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./jupyter.Dockerfile
        push: true
        tags: ${{ env.IMAGE_URL }}
        cache-from: type=gha
        cache-to: type=gha,mode=min

  deploy_pipeline:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Εγκατάσταση του yq στον runner
      - name: Install yq
        uses: mikefarah/yq@v4.44.1
        with:
          cmd: yq --version

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Εκτέλεση του deployment με το σωστό mount για το yq
      - name: Detect and Submit Changed Pipelines
        env:
          IMAGE_URL: ${{ needs.build_and_push.outputs.image_url }}
          KUBEFLOW_URL: ${{ secrets.KUBEFLOW_URL }}
          KUBEFLOW_USERNAME: ${{ secrets.KUBEFLOW_USERNAME }}
          KUBEFLOW_PASSWORD: ${{ secrets.KUBEFLOW_PASSWORD }}
        run: |
          # 1. Βρίσκουμε τα αλλαγμένα αρχεία ΕΞΩ από το container
          PRE_COMMIT_SHA=${{ github.event.before }}
          SHA=${{ github.sha }}
          
          # Ασφάλεια για το πρώτο commit
          if [ -z "$PRE_COMMIT_SHA" ] || [ "$PRE_COMMIT_SHA" == "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-files)
          else
            CHANGED_FILES=$(git diff --name-only $PRE_COMMIT_SHA $SHA || git ls-files)
          fi
          
          echo "Changed files detected on host: $CHANGED_FILES"
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed, skipping deploy."
            exit 0
          fi

          # 2. Τρέχουμε το script περνώντας τα CHANGED_FILES ως μεταβλητή
          YQ_PATH=$(which yq)
          docker run --rm \
            --entrypoint /bin/bash \
            -v $YQ_PATH:/usr/bin/yq \
            -e KUBEFLOW_URL -e KUBEFLOW_USERNAME -e KUBEFLOW_PASSWORD \
            -e IMAGE_URL \
            -e CHANGED_FILES="$CHANGED_FILES" \
            ${{ needs.build_and_push.outputs.image_url }} \
            -c "chmod +x scripts/deploy_pipeline.sh && ./scripts/deploy_pipeline.sh"