name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.set_image_url.outputs.image_url }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set image url
      id: set_image_url
      run: | 
        # Make image url output for Deploy_Pipeline Job
        URL="ghcr.io/${{ github.repository }}:v1.0.${{(github.run_number)}}-${{github.sha}}"
        echo "IMAGE_URL=$URL" >> $GITHUB_ENV
        echo "image_url=$URL" >> $GITHUB_OUTPUT

    - name: Generate strict requirements dynamically
      run: |
        python -m pip install pip-tools
        
        # 1. Rename the file temporarily in the runner
        mv requirements.txt requirements.in
        
        # 2. The pip-tools reads the .in file and generates the new, strict .txt file for the Docker image!
        pip-compile requirements.in -o requirements.txt
        
        # Optional: Print the file to logs so you can see which versions were selected
        # cat requirements.txt

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./jupyter.Dockerfile
        push: true
        tags: ${{ env.IMAGE_URL }}
        cache-from: type=gha
        cache-to: type=gha,mode=min

  deploy_pipeline:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install kfp και pyyaml in order for the script to create YAML files
          pip install kfp==2.16.1 pyyaml 

      - name: Detect and Submit Changed Pipelines
        env:
          IMAGE_URL: ${{ needs.build_and_push.outputs.image_url }}
          KUBEFLOW_URL: ${{ secrets.KUBEFLOW_URL }}
          KUBEFLOW_USERNAME: ${{ secrets.KUBEFLOW_USERNAME }}
          KUBEFLOW_PASSWORD: ${{ secrets.KUBEFLOW_PASSWORD }}
        run: |
          # 1. Find changed files based on Git
          PRE_COMMIT_SHA=${{ github.event.before }}
          SHA=${{ github.sha }}

          # If it is the first commit, use SHA = 0
          if [ -z "$PRE_COMMIT_SHA" ] || [ "$PRE_COMMIT_SHA" == "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-files)
          else
            CHANGED_FILES=$(git diff --name-only $PRE_COMMIT_SHA $SHA || git ls-files)
          fi
          
          export CHANGED_FILES
          echo "Changed files: $CHANGED_FILES"
          
          if [ -z "$CHANGED_FILES" ]; then exit 0; fi

          # 2. Run script on runner
          chmod +x scripts/deploy_pipeline.sh
          ./scripts/deploy_pipeline.sh
