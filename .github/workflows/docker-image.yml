name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.set_image_url.outputs.image_url }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set image url
      id: set_image_url
      run: | 
        # Generate image URL for the Deploy_Pipeline Job
        URL="ghcr.io/${{ github.repository }}:v1.0.${{(github.run_number)}}-${{github.sha}}"
        echo "IMAGE_URL=$URL" >> $GITHUB_ENV
        echo "image_url=$URL" >> $GITHUB_OUTPUT

    - name: Generate strict requirements dynamically
      run: |
        # Use uv for faster and more reliable dependency resolution
        pip install uv
        
        # Create a "locked" file to ensure deterministic builds in Docker
        # while keeping the original requirements.txt clean in Git
        uv pip compile --upgrade-package numpy --resolver=backtracking requirements.txt -o requirements.txt.locked

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./jupyter.Dockerfile
        push: true
        tags: ${{ env.IMAGE_URL }}
        cache-from: type=gha
        cache-to: type=gha,mode=min

  deploy_pipeline:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kfp>=2.0.0

      - name: Detect and Submit Changed Pipelines
        env:
          IMAGE_URL: ${{ needs.build_and_push.outputs.image_url }}
          KUBEFLOW_URL: ${{ secrets.KUBEFLOW_URL }}
          KUBEFLOW_USERNAME: ${{ secrets.KUBEFLOW_USERNAME }}
          KUBEFLOW_PASSWORD: ${{ secrets.KUBEFLOW_PASSWORD }}
        run: |
          # 1. Identify changed files based on Git history
          PRE_COMMIT_SHA=${{ github.event.before }}
          SHA=${{ github.sha }}

          # Use full file list if this is the first commit
          if [ -z "$PRE_COMMIT_SHA" ] || [ "$PRE_COMMIT_SHA" == "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-files)
          else
            CHANGED_FILES=$(git diff --name-only $PRE_COMMIT_SHA $SHA || git ls-files)
          fi
          
          export CHANGED_FILES
          echo "Changed files: $CHANGED_FILES"
          
          if [ -z "$CHANGED_FILES" ]; then exit 0; fi

          # 2. Run the deployment script
          chmod +x scripts/deploy_pipeline.sh
          ./scripts/deploy_pipeline.sh